name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test
        run: npm test
      - name: Syntax check
        run: npm run check
      - name: Antigravity adapter dry run
        run: node antigravity/install.mjs --dry-run
      - name: Antigravity absolute paths
        run: |
          tmp=$(mktemp -d)
          HOME="$tmp" node antigravity/install.mjs >/dev/null
          grep -q "$tmp/.codex/skills" "$tmp/.gemini/config/skills.json"
          echo "skills.json uses absolute paths" 
